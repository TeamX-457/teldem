{% extends "base.html" %}
{% block title %}Password reset complete — {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="section bg-surface text-center">
  <div class="container-teldem max-w-md mx-auto card">
    <h1 class="text-2xl font-bold tracking-tight">Password updated</h1>
    <p class="mt-3 text-sm text-ink-muted">Your password has been changed successfully. You can now log in.</p>
    <a href="{% url 'accounts:login' %}" class="btn-primary mt-6 inline-flex">Log in</a>
  </div>
</section>
{% endblock %}
