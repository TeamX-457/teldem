{% extends "base.html" %}
{% block title %}Check your email — {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="section bg-surface text-center">
  <div class="container-teldem max-w-md mx-auto card">
    <h1 class="text-2xl font-bold tracking-tight">Check your email</h1>
    <p class="mt-3 text-sm text-ink-muted">
      If an account exists with that email, we've sent instructions for resetting your password.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn-primary mt-6 inline-flex">Back to log in</a>
  </div>
</section>
{% endblock %}
